# Phase 2: Omni-Modal Full Fine-Tuning
# ─────────────────────────────────────────────
model:
  llm_model: "Qwen/Qwen3.5-0.8B"
  audio_encoder: "typhoon-ai/typhoon-whisper-turbo"

data:
  # Mixing ratios (must sum to 1.0)
  audio_ratio: 0.35
  text_ratio:  0.35
  vision_ratio: 0.30
  total_samples: 200000   # Per epoch
  max_audio_seconds: 30.0
  max_text_length: 1024

  audio:
    # Large-scale Typhoon Audio preview data
    hf_dataset_name: "typhoon-ai/typhoon-audio-preview-data"
    hf_dataset_config: null
    hf_split: "sft"

  text:
    # High-quality Thai instruction tuning dataset from Typhoon
    hf_dataset_name: "typhoon-ai/typhoon-s-instruct-post-training"
    hf_split: "sft"

  vision:
    # Multimodal image understanding dataset from Typhoon
    hf_dataset_name: "typhoon-ai/typhoon-vision-preview-data"
    hf_split: "finetune"
    colpali_mode: false

training:
  num_epochs: 2
  batch_size: 4
  eval_batch_size: 8
  gradient_accumulation_steps: 8   # effective batch = 32
  llm_lr: 2.0e-5                   # Lower for LLM backbone
  projector_lr: 1.0e-4             # Higher for projector
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  num_workers: 8
  save_steps: 1000
  output_dir: "outputs/phase2"

logging:
  use_wandb: true
  wandb_project: "thai-omni-modal"
  run_name: "phase2-omni-finetune"
  log_every: 5
