# Phase 2: Omni-Modal Full Fine-Tuning
# ─────────────────────────────────────────────
model:
  llm_model: "Qwen/Qwen3.5-0.8B"
  audio_encoder: "typhoon-ai/typhoon-whisper-turbo"

data:
  # Mixing ratios (must sum to 1.0)
  audio_ratio: 0.35
  text_ratio:  0.35
  vision_ratio: 0.30
  total_samples: 10000   # ลดลงให้เหมาะกับ cloud budget
  max_audio_seconds: 30.0
  max_text_length: 1024

  audio:
    # Google FLEURS TH — เสียงจริงฝังใน HF (แก้แล้วจาก Phase 1)
    hf_dataset_name: "google/fleurs"
    hf_dataset_config: "th_th"
    hf_split: "train"
    text_column: "transcription"

  text:
    # FineTome — high-quality instruction dataset, ไม่ต้อง login
    hf_dataset_name: "mlabonne/FineTome-100k"
    hf_split: "train"

  vision:
    # LLaVA Instruct — load only llava_instruct_150k.json to avoid schema
    # mismatch with llava_v1_5_mix665k.json (which adds an extra 'model' column)
    hf_dataset_name: "liuhaotian/LLaVA-Instruct-150K"
    hf_split: "train"
    data_files: "llava_instruct_150k.json"
    colpali_mode: false

training:
  num_epochs: 2
  batch_size: 2
  eval_batch_size: 4
  gradient_accumulation_steps: 16   # effective batch = 32
  llm_lr: 2.0e-5
  projector_lr: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  num_workers: 4
  save_steps: 100
  output_dir: "outputs/phase2"
  push_to_hub: true
  hub_model_id: "thai-omni-modal-0.8b-phase2"
  hub_private: true

logging:
  use_wandb: true
  wandb_project: "thai-omni-modal"
  run_name: "phase2-omni-finetune"
  log_every: 50
