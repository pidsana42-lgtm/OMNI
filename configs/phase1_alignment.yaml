# Phase 1: Audio Alignment
# ─────────────────────────────────────────────
model:
  llm_model: "Qwen/Qwen3.5-0.8B"
  audio_encoder: "typhoon-ai/typhoon-whisper-turbo"
  projector_hidden: 2048
  projector_layers: 2

data:
  # Primary: Typhoon Audio Preview Data (ASR & Multimodal Thai)
  hf_dataset_name: "typhoon-ai/typhoon-audio-preview-data"
  hf_dataset_config: null
  hf_split: "pretrained"
  eval_split: "sft"
  max_audio_seconds: 30.0
  max_text_length: 256

training:
  num_epochs: 3
  batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 4   # effective batch = 32
  lr: 1.0e-3                       # High LR for projector-only training
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  num_workers: 8
  save_steps: 500
  output_dir: "outputs/phase1"

logging:
  use_wandb: true
  wandb_project: "thai-omni-modal"
  run_name: "phase1-audio-alignment"
  log_every: 50
