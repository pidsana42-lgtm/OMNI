# Phase 1: Audio Alignment
# ─────────────────────────────────────────────
model:
  llm_model: "Qwen/Qwen3.5-0.8B"
  audio_encoder: "typhoon-ai/typhoon-whisper-turbo"
  projector_hidden: 2048
  projector_layers: 2

data:
  # Mozilla Common Voice TH — มีไฟล์เสียงจริงอยู่ใน HF โดยตรง (ไม่ต้องโหลดจากดิสก์)
  hf_dataset_name: "mozilla-foundation/common_voice_17_0"
  hf_dataset_config: "th"
  hf_split: "train"
  eval_split: "validation"
  text_column: "sentence"   # คอลัมน์คำถอดเสียงของ Common Voice
  max_audio_seconds: 30.0
  max_text_length: 256

training:
  num_epochs: 3
  batch_size: 4                     # Reduced from 8 to 4 to prevent CUDA OOM
  eval_batch_size: 8                # Reduced from 16 to 8 to prevent CUDA OOM
  gradient_accumulation_steps: 8    # Increased from 4 to 8 (effective batch size remains 32)
  lr: 1.0e-3                        # High LR for projector-only training
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  num_workers: 8
  save_steps: 500
  output_dir: "outputs/phase1"
  
  # Dataset size limits — Common Voice TH มีประมาณ 2,000 train samples
  max_train_samples: 2000
  max_eval_samples: 200

  # Automatic Hugging Face Hub synchronization
  push_to_hub: true
  hub_model_id: "thai-omni-modal-0.8b-phase1"
  hub_private: true

logging:
  use_wandb: true
  wandb_project: "thai-omni-modal"
  run_name: "phase1-audio-alignment-real"  # real audio run
  log_every: 50
