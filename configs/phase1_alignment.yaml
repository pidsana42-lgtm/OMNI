# Phase 1: Audio Alignment (Extended v2)
# ─────────────────────────────────────────────
# เพิ่ม dataset และ steps เพื่อให้ AudioProjector align ได้แม่นยำขึ้น
# เป้าหมาย: eval_loss < 1.5 (จาก ~2.0 ของ v1)
model:
  llm_model: "Qwen/Qwen3.5-0.8B"
  audio_encoder: "typhoon-ai/typhoon-whisper-turbo"
  projector_hidden: 2048
  projector_layers: 2

data:
  max_audio_seconds: 30.0
  max_text_length: 256
  
  audio_datasets:
    - hf_dataset_name: "google/fleurs"
      hf_dataset_config: "th_th"
      hf_split: "train"
      eval_split: "validation"
      text_column: "transcription"
    - hf_dataset_name: "CMKL/Porjai-Thai-voice-dataset-central"
      hf_split: "train"
      eval_split: "train"
      text_column: "sentence"
    - hf_dataset_name: "Thanarit/Thai-Voice-10000"
      hf_split: "train"
      eval_split: "train"
      text_column: "transcript"
    - hf_dataset_name: "Thanarit/Thai-Voice-Test7"
      hf_split: "train"
      eval_split: "train"
      text_column: "transcript"

training:
  num_epochs: 5                     # เพิ่มจาก 3 → 5 epochs (3,000 × 5 = 15,000 steps)
  batch_size: 4
  eval_batch_size: 8
  gradient_accumulation_steps: 8    # effective batch = 32
  lr: 1.0e-3                        # High LR เหมาะสำหรับ projector-only
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.05                # Warmup ช่วยให้ projector ไม่ระเบิดช่วงแรก
  num_workers: 4
  save_steps: 100
  output_dir: "outputs/phase1"

  # ใช้ชุดข้อมูลผสมทั้งหมด
  max_train_samples: 20000
  max_eval_samples: 1000

  # Automatic Hugging Face Hub synchronization
  push_to_hub: true
  hub_model_id: "thai-omni-modal-0.8b-phase1"
  hub_private: true

logging:
  use_wandb: true
  wandb_project: "thai-omni-modal"
  run_name: "phase1-audio-alignment-v2-extended"
  log_every: 50
